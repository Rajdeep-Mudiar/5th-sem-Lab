<html>
	<head>
		<title>Registration Form</title>
	</head>
	<body>
		<div>
			<h2>Registration Form</h2>
			<form>
				<label>Name: </label>
				<input type = "text" placeholder = "enter your name"><br><br>
				<label>email: </label>
				<input type = "email" placeholder = "enter your email"><br><br>
				<label>DOB: </label>
				<input type = "date"><br><br>
				<label>Gender:</label><br>
				<input type = "radio" value = "male">Male<br>
				<input type = "radio" value = "female">Female<br>
				<input type = "radio" value = "others">Others<br><br>
				<label>State:</label>
				<select name = "State">
					<option value = " ">----Select State----</option>
					<option value = "Assam">Assam</option>
					<option value = "Delhi">Delhi</option>
				</select><br><br>
				<label>Password:</label>
				<input type = "password" placeholder = "enter your password"><br><br>
				<label>Comments:</label>
				<textarea row = 5 column = 10 placeholder = "write your comments"></textarea><br><br>
				<input type = "checkbox">
				<label>accept terms and conditions</label><br><br>
				<button type = "submit">Submit</button>
				<button type = "reset">Reset</button>					
	</body>
</html>
